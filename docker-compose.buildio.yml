# Production Docker Compose for build.io deployment
# All services containerized: Postgres + Router
version: "3.8"

services:
  # PostgreSQL database - self-hosted in Docker for build.io
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: router
      POSTGRES_USER: router
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-router_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script runs once on first DB creation and applies the canonical
      # schema (router.*-qualified DDL).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U router -d router"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
    restart: unless-stopped


  # Router server - the main AI model router
  server:
    build:
      context: .
      args:
        ROUTER_SHA: ${GIT_COMMIT:-unknown}
        ROUTER_BUILD_TIME: ${BUILD_TIME:-unknown}
        ROUTER_PR: ${PR_NUMBER:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Server
      PORT: "8080"
      ROUTER_CLUSTER_VERSION: ${ROUTER_CLUSTER_VERSION:-v0.76}
      ROUTER_CLUSTER_BUILD_ALL_VERSIONS: ${ROUTER_CLUSTER_BUILD_ALL_VERSIONS:-false}
      ROUTER_EMBED_ONLY_USER_MESSAGE: ${ROUTER_EMBED_ONLY_USER_MESSAGE:-false}
      ROUTER_SESSION_PIN_ENABLED: ${ROUTER_SESSION_PIN_ENABLED:-true}
      ROUTER_HARD_PIN_EXPLORE: ${ROUTER_HARD_PIN_EXPLORE:-true}
      ROUTER_PLANNER_ENABLED: ${ROUTER_PLANNER_ENABLED:-true}
      ROUTER_SCORE_TOOL_RESULT_TURNS: ${ROUTER_SCORE_TOOL_RESULT_TURNS:-true}
      ROUTER_SEMANTIC_CACHE_ENABLED: ${ROUTER_SEMANTIC_CACHE_ENABLED:-true}
      ROUTER_SSE_KEEPALIVE_INTERVAL_SECONDS: ${ROUTER_SSE_KEEPALIVE_INTERVAL_SECONDS:-15}
      ROUTER_EXCLUDED_MODELS: ${ROUTER_EXCLUDED_MODELS:-}

      # Provider keys
      AIAND_API_KEY: ${AIAND_API_KEY}
      AIAND_API_URL: ${AIAND_API_URL:-https://api.aiand.com/v1}
      
      # Database
      DATABASE_URL: postgres://router:${POSTGRES_PASSWORD:-router_production}@postgres:5432/router?sslmode=disable

      
      # OTel / Telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-router}
      
      # BYOK encryption (required for production with customer keys)
      EXTERNAL_KEY_ENCRYPTION_KEY: ${EXTERNAL_KEY_ENCRYPTION_KEY}
      # Onnx assets path inside container
      ROUTER_ONNX_ASSETS_DIR: /opt/router/assets
      ROUTER_ONNX_LIBRARY_DIR: /usr/lib

      # HMM policy sidecar (hmm profile). v3 contract: the router owns arm
      # selection and REQUIRES a v6 roster file when the sidecar URL is set —
      # the server refuses to boot otherwise (and 503s every hmm turn against
      # a pre-v3 sidecar image; rebuild + redeploy both together).
      ROUTER_HMM_SIDECAR_URL: ${ROUTER_HMM_SIDECAR_URL:-}
      ROUTER_HMM_ROSTER_PATH: ${ROUTER_HMM_ROSTER_PATH:-/opt/router/hmm_router_cluster_roster_v6.json}
    volumes:
      - ./sidecars/hmm/roster/hmm_router_cluster_roster_v6.json:/opt/router/hmm_router_cluster_roster_v6.json:ro
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: HMM policy sidecar for enhanced routing
  hmm-sidecar:
    profiles:
      - hmm
    build:
      context: .
      dockerfile: sidecars/hmm/Dockerfile
    environment:
      PORT: "8093"
      ROUTER_HMM_SIDECAR_URL: http://hmm-sidecar:8093
    ports:
      - "8093:8093"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8093/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Load balancer / reverse proxy (optional - for TLS termination)
  nginx:
    image: nginx:alpine
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    deploy:
      placement:
        constraints:
          - node.role == manager
    restart: unless-stopped
    profiles:
      - proxy

volumes:
  postgres_data:
    driver: local

networks:
  default:
    driver: bridge
