  x probe factor (1.02 on hard clusters {0,13}, 0.97 elsewhere; 30-prompt probe 2026-08-29).
  qwen3.8-27b quality = pool max x 0.92 everywhere (TierLow pool model, wins no clusters).
  GLM-5.3 shares GLM-5.2''s 743B base with better agentic benchmarks (AA Index 60
  vs 53, Terminal-Bench 3.0 28.3 vs 4.6, DeepSWE v1.1 66.9 vs 46.2). Costs pinned
  from ai& catalog (live prices) for all 6 models. rankings.json intentionally absent.
